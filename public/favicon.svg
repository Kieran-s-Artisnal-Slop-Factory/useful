<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- useful — blueprint registration mark on a cyanotype sheet -->
  <rect width="128" height="128" fill="#142e63"/>
  <!-- drafting grid -->
  <g stroke="#e8eef7" stroke-opacity=".13" stroke-width="2">
    <path d="M32 0v128M64 0v128M96 0v128M0 32h128M0 64h128M0 96h128"/>
  </g>
  <!-- double sheet frame: heavy inner rule, faint offset outer rule -->
  <rect x="18" y="18" width="92" height="92" fill="none" stroke="#e8eef7" stroke-width="5"/>
  <rect x="9" y="9" width="110" height="110" fill="none" stroke="#e8eef7" stroke-opacity=".4" stroke-width="2"/>
  <!-- registration crosshair -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#e8eef7" stroke-width="6"/>
  <path d="M64 30v14M64 84v14M30 64h14M84 64h14" stroke="#e8eef7" stroke-width="6" stroke-linecap="square"/>
  <!-- surveyor's stamp -->
  <circle cx="64" cy="64" r="7" fill="#f2c53d"/>
</svg>
