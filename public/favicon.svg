<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- useful — drafting compass on a cyanotype sheet -->
  <rect width="128" height="128" fill="#142e63"/>
  <!-- drafting grid -->
  <g stroke="#e8eef7" stroke-opacity=".13" stroke-width="2">
    <path d="M32 0v128M64 0v128M96 0v128M0 32h128M0 64h128M0 96h128"/>
  </g>
  <!-- sheet frame (single heavy rule — a faint second rule is sub-pixel noise
       at tab sizes) -->
  <rect x="10" y="10" width="108" height="108" fill="none" stroke="#e8eef7" stroke-width="6"/>
  <!-- compass: handle, hinge, two legs -->
  <g stroke="#e8eef7" fill="none" stroke-linecap="square">
    <path d="M64 22v9" stroke-width="8"/>
    <circle cx="64" cy="39" r="8" stroke-width="7"/>
    <path d="M59 47 44 90M69 47l15 43" stroke-width="8"/>
  </g>
  <!-- the amber arc it just drew -->
  <path d="M38 97q26 15 52 0" fill="none" stroke="#f2c53d" stroke-width="6"/>
</svg>
